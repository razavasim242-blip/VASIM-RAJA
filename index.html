    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piyush Travels & Online Seva Kendra</title>
    <meta name="description" content="One-stop cyber cafe & digital service center in Bagahi Bazar for certificates (Aay, Jaati, Niwas, NCL), PAN, Voter ID, Railway ticket, pensions, insurance, online forms and payments." />

    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('piyush_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
